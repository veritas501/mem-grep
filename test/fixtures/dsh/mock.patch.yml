# Points a throwaway DeepSeek Harness profile at the scripted mock model
# (test/fixtures/gen/mock-model.mjs), so gen.sh can make it write sessions without an account.
# MOCK_PORT and the session root are filled in by gen.sh before the run.
- id: llm-deepseek
  config:
    baseURL: "http://127.0.0.1:MOCK_PORT"
    thinking: disabled
    models:
      - id: mock-1
        contextWindow: 128000
        maxTokens: 8192

- id: agent-default-model
  config:
    provider: deepseek-official
    model: mock-1

- id: session-persistence-jsonl
  config:
    root: "SESSION_ROOT"
    compression: zstd
